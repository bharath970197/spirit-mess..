services:
  - type: web
    name: campus-mess-management
    runtime: node
    plan: free
    rootDir: mess-management
    buildCommand: cp package-web.json package.json && npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
