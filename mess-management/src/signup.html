<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Mess Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#052e24,#065f46,#0f766e);display:flex;align-items:center;justify-content:center;padding:25px}
.container{width:100%;max-width:480px;background:#fff;padding:35px;border-radius:18px;box-shadow:0 18px 50px #0004}
h1{text-align:center;color:#064e3b;margin:0 0 8px}
.subtitle{text-align:center;color:#64748b;margin:0 0 25px}
label{display:block;font-weight:600;color:#334155;margin:14px 0 7px}
input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:white}
input:focus,select:focus{outline:2px solid #10b981;border-color:#10b981}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:8px;background:#047857;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#065f46}
button:disabled{opacity:.6;cursor:not-allowed}
#message{display:none;margin-top:15px;padding:12px;border-radius:8px;text-align:center}
.footer{text-align:center;margin-top:20px;color:#64748b}
a{color:#047857;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<div class="container">
    <h1>Create Account</h1>
    <p class="subtitle">Join the Mess Management System</p>

    <form id="signupForm">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Enter your full name" required>

        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Choose a username" minlength="3" required>

        <label for="hostel">Select Hostel</label>
        <select id="hostel" required>
            <option value="">Choose your hostel</option>
            <option value="Sophia">Sophia</option>
            <option value="Cicily">Cicily</option>
            <option value="Joseph">Joseph</option>
            <option value="Alphonsa">Alphonsa</option>
        </select>

        <label for="foodPreference">Food Preference</label>
        <select id="foodPreference" required>
            <option value="">Choose food preference</option>
            <option value="Vegetarian">Vegetarian</option>
            <option value="Non-Vegetarian">Non-Vegetarian</option>
        </select>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Minimum 6 characters" minlength="6" required>

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" placeholder="Re-enter password" required>

        <button type="submit">Create Account</button>
        <div id="message" role="status"></div>
    </form>

    <div class="footer">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>
<script src="js/signup.js"></script>
</body>
</html>
