<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initial Admin Setup</title>
<link rel="stylesheet" href="css/style.css">
<style>
.setup-wrap{max-width:440px;margin:8vh auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
.setup-wrap h1{margin-top:0}.setup-wrap label{display:block;margin:14px 0 6px;font-weight:600}
.setup-wrap input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}
.setup-wrap button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;cursor:pointer}
#setupStatus{margin-top:14px}
</style>
</head>
<body>
<main class="setup-wrap">
<h1>Initial Admin Setup</h1>
<p>Create the first administrator account. This page works only while no admin account exists.</p>
<form id="setupForm">
<label for="setupKey">Setup key from Render environment</label>
<input id="setupKey" type="password" required autocomplete="off">
<label for="username">Admin username</label>
<input id="username" minlength="3" maxlength="40" required>
<label for="password">Admin password</label>
<input id="password" type="password" minlength="10" required autocomplete="new-password">
<button type="submit">Create Admin Account</button>
</form>
<p id="setupStatus" role="status"></p>
<p><a href="login.html">Return to login</a></p>
</main>
<script src="js/admin-setup.js"></script>
</body>
</html>
