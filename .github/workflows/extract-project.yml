name: Extract uploaded project ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          test -f 88888.zip
          unzip -o 88888.zip -d .
          cp mess-management/package-web.json mess-management/package.json
          node --check mess-management/server.js
          node --check mess-management/src/js/web-adapter.js
          node --check mess-management/src/js/feedback-web.js

      - name: Commit extracted project and web configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mess-management render.yaml
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract project and prepare web deployment"
            git push
          fi
