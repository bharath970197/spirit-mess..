name: Extract uploaded project ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          test -f 88888.zip
          unzip -o 88888.zip -d .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mess-management
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Add extracted mess management project"
            git push
          fi
